# HTTP 全部跳到 HTTPS（证书验证路径除外）
server {
    listen 80;
    server_name javalinky.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name javalinky.example.com;

    # 这两行由 certbot 自动填写
    ssl_certificate     /etc/letsencrypt/live/javalinky.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/javalinky.example.com/privkey.pem;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;      # 上传限制

    # 不要让内部端点暴露到公网
    location /internal/ { deny all; }

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-Id      $request_id;   # nginx 自己生成

        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
